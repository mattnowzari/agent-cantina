[package]
name = "tui"
version = "0.1.0"
edition = "2024"

[dependencies]
alembic-log = "0.1.3"
anyhow = "1"
dotenvy = "0.15.7"
ratatui = "0.29"
reqwest = { version = "0.13", features = ["json", "rustls-native-certs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
textwrap = "0.16"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
